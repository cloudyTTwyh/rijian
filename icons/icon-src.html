<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  .icon {
    width: 100vw; height: 100vh;
    background: #2b2723;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Songti SC", "SimSun", "STSong", serif;
  }
  .frame {
    position: absolute;
    inset: 10.5vh;
    border: 0.3vh solid rgba(245, 242, 234, 0.26);
    border-radius: 12vh;
  }
  .ch {
    color: #f5f2ea;
    font-size: 52vh;
    line-height: 1;
    margin-top: -3.5vh;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="frame"></div>
    <div class="ch">日</div>
  </div>
</body>
</html>
